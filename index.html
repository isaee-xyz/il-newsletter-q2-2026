<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2c52'/%3E%3Cpath d='M8 10h7l6 6-6 6H8l6-6z' fill='%232e86c8'/%3E%3C/svg%3E">
<!-- Deliberately no rel=preload for the PDF: the viewer fetches it in ranges,
     and preloading would pull all 4.1MB up front and defeat that. -->

<style>
  :root{
    --navy:#0f2c52;
    --blue:#2e86c8;
    --paper:#eceef2;
    --ink:#0f2c52;
    --muted:#5b6b82;
    --radius:14px;
  }

  *{box-sizing:border-box}

  html,body{
    height:100%;
    /* The deck owns scrolling; the document itself never scrolls. */
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    margin:0;
    /* Column layout: the strip takes what it needs, the deck takes the rest,
       so safe-area insets never have to be baked into a height calc. */
    display:flex;
    flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }

  main{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }

  .pager{
    position:absolute;
    left:12px;
    left:max(12px,env(safe-area-inset-left));
    bottom:20px;
    bottom:max(20px,env(safe-area-inset-bottom));
    z-index:25;
    font-size:12px;
    font-weight:650;
    font-variant-numeric:tabular-nums;
    color:#fff;
    background:rgba(15,44,82,.5);
    padding:5px 11px;
    border-radius:999px;
    white-space:nowrap;
    pointer-events:none;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:34px;
    padding:0 13px;
    border-radius:999px;
    background:var(--blue);
    color:#fff;
    font-size:13px;
    font-weight:650;
    text-decoration:none;
    border:0;
    cursor:pointer;
    white-space:nowrap;
  }

  .btn:hover{background:#3d97da}
  .btn:active{transform:scale(.97)}
  .btn svg{width:15px;height:15px;flex:none}

  /* ---------- segmented progress (story style) ---------- */
  .topline{
    flex:none;
    z-index:30;
    background:var(--navy);
    padding:max(9px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 9px max(10px,env(safe-area-inset-left));
  }

  .progress{
    display:flex;
    gap:3px;
    align-items:center;
  }

  .seg{
    flex:1 1 0;
    height:3px;
    min-width:0;
    padding:0;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.22);
    cursor:pointer;
    transition:background .25s ease,transform .2s ease;
  }

  .seg.done{background:rgba(255,255,255,.5)}
  .seg.active{background:#fff;transform:scaleY(1.6)}

  /* ---------- the deck: one page per screen, swipe up ---------- */
  .deck{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    /* Stop an overscroll at either end from pulling-to-refresh or navigating back. */
    overscroll-behavior-y:contain;
    scrollbar-width:none;
  }

  .deck::-webkit-scrollbar{display:none}

  .slide{
    flex:0 0 100%;
    width:100%;
    height:100%;
    scroll-snap-align:center;
    /* Forces exactly one page per gesture, however hard the swipe. */
    scroll-snap-stop:always;
    padding:10px 10px 14px;
    padding-bottom:max(14px,env(safe-area-inset-bottom));
  }

  .stage{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
  }

  /* Sized in px from JS so the shadow hugs the page, not the letterbox. */
  .frame{
    position:relative;
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 2px 6px rgba(10,32,64,.10),0 14px 40px rgba(10,32,64,.16);

    /* The card transition. One keyframe set drives two delivery mechanisms:
       a scroll-driven timeline where supported, and a paused animation
       scrubbed by negative delay from JS everywhere else. Longhands only —
       the `animation` shorthand would reset animation-timeline. */
    animation-name:cardSwipe;
    animation-duration:1s;
    animation-timing-function:linear;
    animation-fill-mode:both;
    animation-play-state:paused;
    animation-delay:-.5s; /* centred, until something scrubs it */
  }

  @keyframes cardSwipe{
    0%   {transform:translateY(9%) scale(.9);opacity:.45}
    50%  {transform:translateY(0) scale(1);opacity:1}
    100% {transform:translateY(-9%) scale(.9);opacity:.45}
  }

  /* Preferred path: the compositor drives the card straight from scroll
     position, so it stays locked to the finger through momentum scrolling. */
  @supports (animation-timeline:view()){
    .frame{
      animation-timeline:view();
      animation-duration:auto;
      animation-play-state:running;
      animation-delay:0s;
    }
  }

  .frame canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .frame .skeleton{
    position:absolute;
    inset:0;
    background:linear-gradient(100deg,rgba(15,44,82,.04) 30%,rgba(15,44,82,.09) 50%,rgba(15,44,82,.04) 70%) #fff;
    background-size:220% 100%;
    animation:shimmer 1.5s linear infinite;
  }

  .frame.ready .skeleton{display:none}

  @keyframes shimmer{
    from{background-position:120% 0}
    to{background-position:-120% 0}
  }

  /* ---------- flip controls, stacked bottom-right ---------- */
  .nav{
    position:absolute;
    right:12px;
    right:max(12px,env(safe-area-inset-right));
    z-index:25;
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border:0;
    border-radius:50%;
    background:rgba(15,44,82,.55);
    color:#fff;
    cursor:pointer;
    transition:opacity .2s ease,background .2s ease;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }

  .nav:hover{background:rgba(15,44,82,.78)}
  .nav:active{transform:scale(.94)}
  .nav svg{width:20px;height:20px}
  .nav.prev{bottom:76px}
  .nav.next{bottom:24px;bottom:max(24px,env(safe-area-inset-bottom))}
  .nav[disabled]{opacity:0;pointer-events:none}

  /* ---------- first-run instruction ---------- */
  .onboard{
    position:absolute;
    inset:0;
    z-index:50;
    display:grid;
    place-items:center;
    padding:24px;
    background:rgba(10,32,64,.72);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    transition:opacity .35s ease;
  }

  .onboard.gone{opacity:0;pointer-events:none}
  .onboard[hidden]{display:none}

  .onboard-card{
    width:min(100%,320px);
    padding:26px 24px 22px;
    text-align:center;
    background:#fff;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(10,32,64,.3);
  }

  .swipe-icon{
    height:58px;
    display:grid;
    place-items:center;
    margin-bottom:6px;
    color:var(--blue);
  }

  .swipe-icon svg{width:30px;height:30px}
  .swipe-icon svg:first-child{opacity:.35;margin-bottom:-12px;animation:rise 1.6s ease-in-out infinite}
  .swipe-icon svg:last-child{animation:rise 1.6s ease-in-out .18s infinite}

  @keyframes rise{
    0%,100%{transform:translateY(3px);opacity:.35}
    50%{transform:translateY(-3px);opacity:1}
  }

  .onboard-card h2{
    margin:0 0 8px;
    font-size:19px;
    letter-spacing:-.3px;
  }

  .onboard-card p{
    margin:0 0 18px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
  }

  .onboard-card .btn{width:100%;height:42px;font-size:14px}

  /* ---------- status / fallback ---------- */
  .status{
    position:absolute;
    z-index:40;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(88%,420px);
    padding:26px 22px;
    text-align:center;
    background:#fff;
    border-radius:var(--radius);
    box-shadow:0 14px 44px rgba(10,32,64,.16);
  }

  .status h2{margin:0 0 8px;font-size:16px}
  .status p{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:var(--muted)}

  .spinner{
    width:26px;
    height:26px;
    margin:0 auto 14px;
    border:3px solid rgba(15,44,82,.14);
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }

  @keyframes spin{to{transform:rotate(360deg)}}

  .sr{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
  }

  /* ---------- responsive ---------- */
  @media (max-width:640px){
    .nav{width:36px;height:36px;background:rgba(15,44,82,.42)}
    .nav svg{width:17px;height:17px}
    .nav.prev{bottom:68px}
    .slide{padding:8px 8px 12px}
  }

  @media (min-width:900px){
    .slide{padding:18px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
    .deck{scroll-behavior:auto}
    /* Drop the card motion entirely rather than flashing it in 0.01ms. */
    .frame{animation-name:none;transform:none;opacity:1}
  }
</style>
</head>
<body>

<div class="topline">
  <div class="progress" id="progress" role="tablist" aria-label="Jump to page"></div>
</div>

<main>
  <h1 class="sr">Quarter at a Glance — IL Newsletter, May to July 2026</h1>
  <p class="sr">Take a look back at the quarter gone by—where ideas turned into action, and action created impact.</p>

  <div class="deck" id="deck" tabindex="0" role="region"
       aria-roledescription="carousel" aria-label="Newsletter pages, one page per screen"></div>

  <span class="pager" id="pager" aria-live="polite">— / —</span>

  <button class="nav prev" id="prev" type="button" aria-label="Previous page" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>
  </button>
  <button class="nav next" id="next" type="button" aria-label="Next page" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg>
  </button>

  <div class="onboard" id="onboard" hidden>
    <div class="onboard-card" role="dialog" aria-modal="true" aria-labelledby="obTitle">
      <div class="swipe-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>
      </div>
      <h2 id="obTitle">Swipe up to read</h2>
      <p id="obBody">One page at a time, like a story. <span id="obCount"></span></p>
      <button class="btn" id="onboardOk" type="button">Got it</button>
    </div>
  </div>

  <div class="status" id="status">
    <div class="spinner" aria-hidden="true"></div>
    <h2>Loading the newsletter…</h2>
    <p id="statusMsg">Fetching the PDF.</p>
    <a class="btn" href="quarter-at-a-glance-may-jul-2026.pdf" target="_blank" rel="noopener">Open PDF directly</a>
  </div>
</main>

<script type="module">
const PDF_URL = 'quarter-at-a-glance-may-jul-2026.pdf';
const SEEN_KEY = 'il-newsletter-q2-2026:onboarded';

const deck      = document.getElementById('deck');
const progress  = document.getElementById('progress');
const pager     = document.getElementById('pager');
const prevBtn   = document.getElementById('prev');
const nextBtn   = document.getElementById('next');
const onboard   = document.getElementById('onboard');
const onboardOk = document.getElementById('onboardOk');
const obCount   = document.getElementById('obCount');
const statusBox = document.getElementById('status');
const statusMsg = document.getElementById('statusMsg');

const fail = (msg) => {
  statusBox.querySelector('.spinner')?.remove();
  statusBox.querySelector('h2').textContent = 'Inline preview unavailable';
  statusMsg.textContent = msg;
};

let pdfjsLib;
try {
  pdfjsLib = await import('./vendor/pdf.min.mjs');
} catch (e) {
  fail('This browser could not load the inline viewer. Use the button below to open the PDF.');
  throw e;
}

pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';

// Cap the backing store so tall pages stay within mobile memory limits.
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
const MAX_CANVAS_PX = 4096;

let pdf;
const slots = [];
let index = 0;

try {
  // Each page of this PDF is one full-page JPEG, so the file is ~97% image data
  // and cannot be shrunk losslessly. Instead, pull it in ranges: the first page
  // paints after a few hundred KB rather than after all 4.1MB. Hosts that do not
  // answer with 206 simply stream the whole file as before.
  const task = pdfjsLib.getDocument({
    url: PDF_URL,
    disableAutoFetch: true,
    rangeChunkSize: 262144,
  });

  task.onProgress = ({ loaded, total }) => {
    if (total) statusMsg.textContent = `Fetching the PDF… ${Math.round((loaded / total) * 100)}%`;
  };
  pdf = await task.promise;
} catch (e) {
  fail('The PDF could not be loaded here. Use the button below to open it directly.');
  throw e;
}

statusBox.remove();

// ---- build one slide per page -------------------------------------------
for (let n = 1; n <= pdf.numPages; n++) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: 1 });

  const slide = document.createElement('section');
  slide.className = 'slide';
  slide.setAttribute('role', 'group');
  slide.setAttribute('aria-roledescription', 'page');
  slide.setAttribute('aria-label', `Page ${n} of ${pdf.numPages}`);

  const stage = document.createElement('div');
  stage.className = 'stage';

  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.innerHTML = '<div class="skeleton"></div>';

  stage.appendChild(frame);
  slide.appendChild(stage);
  deck.appendChild(slide);

  const seg = document.createElement('button');
  seg.className = 'seg';
  seg.type = 'button';
  seg.setAttribute('role', 'tab');
  seg.setAttribute('aria-label', `Page ${n}`);
  seg.addEventListener('click', () => goTo(n - 1));
  progress.appendChild(seg);

  slots.push({ n, page, ar: vp.width / vp.height, vpW: vp.width, vpH: vp.height,
               slide, stage, frame, seg, canvas: null, renderedAt: 0, task: null });
}

// ---- layout: fit each page fully inside its slide ------------------------
function layout(slot) {
  const boxW = slot.stage.clientWidth;
  const boxH = slot.stage.clientHeight;
  if (!boxW || !boxH) return 0;

  // Contain: whichever axis runs out first decides the size.
  const w = Math.min(boxW, boxH * slot.ar);

  slot.frame.style.width = `${Math.round(w)}px`;
  slot.frame.style.height = `${Math.round(w / slot.ar)}px`;
  return Math.round(w);
}

async function render(slot) {
  const cssW = layout(slot);
  if (!cssW) return;
  if (slot.renderedAt && Math.abs(cssW - slot.renderedAt) < 8) return;

  slot.task?.cancel();

  let scale = (cssW * dpr()) / slot.vpW;
  const projected = Math.max(slot.vpW, slot.vpH) * scale;
  if (projected > MAX_CANVAS_PX) scale *= MAX_CANVAS_PX / projected;

  const vp = slot.page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', `Newsletter page ${slot.n} of ${pdf.numPages}`);

  const task = slot.page.render({ canvasContext: canvas.getContext('2d', { alpha: false }), viewport: vp });
  slot.task = task;

  try {
    await task.promise;
  } catch (e) {
    if (e?.name === 'RenderingCancelledException') return;
    throw e;
  }

  slot.canvas?.remove();
  slot.canvas = canvas;
  slot.frame.appendChild(canvas);
  slot.frame.classList.add('ready');
  slot.renderedAt = cssW;
  slot.task = null;
}

function unload(slot) {
  if (!slot.canvas) return;
  slot.task?.cancel();
  slot.task = null;
  slot.canvas.remove();
  slot.canvas = null;
  slot.renderedAt = 0;
  slot.frame.classList.remove('ready');
}

// Keep the current page plus its immediate neighbours ready, so a flip in
// either direction lands on an already-drawn page.
function refresh() {
  slots.forEach((slot, i) => {
    const d = Math.abs(i - index);
    if (d <= 1) render(slot);
    else if (d > 2) unload(slot);
    else layout(slot);

    slot.seg.classList.toggle('active', i === index);
    slot.seg.classList.toggle('done', i < index);
    slot.seg.setAttribute('aria-selected', i === index ? 'true' : 'false');
  });

  pager.textContent = `${index + 1} / ${pdf.numPages}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === pdf.numPages - 1;

  // Covers first paint and post-resize; during a swipe the scroll handler drives it.
  paint();
}

function goTo(i, smooth = true) {
  const target = Math.max(0, Math.min(pdf.numPages - 1, i));
  deck.scrollTo({ top: target * deck.clientHeight, behavior: smooth ? 'smooth' : 'auto' });
  // Update immediately so the flip feels instant even before the scroll settles.
  if (target !== index) {
    index = target;
    refresh();
  }
}

// ---- card transition -----------------------------------------------------
// Where the browser supports scroll-driven animations the CSS above already
// runs the card off the scroll position, and JS must keep its hands off.
// Elsewhere we scrub the same paused keyframes by hand.
const scrollDriven = window.CSS?.supports?.('animation-timeline', 'view()') ?? false;

function paint() {
  if (scrollDriven) return;

  const h = deck.clientHeight;
  if (!h) return;

  const top = deck.scrollTop;

  for (const slot of slots) {
    // 0 when this page is settled in frame, +1 one screen below, -1 above.
    const d = slot.slide.offsetTop / h - top / h;

    if (Math.abs(d) > 1.1) {
      if (slot.frame.style.animationDelay) slot.frame.style.animationDelay = '';
      continue;
    }

    // Map [+1 .. -1] onto the 0s..1s keyframe timeline.
    const p = Math.min(1, Math.max(0, (1 - d) / 2));
    slot.frame.style.animationDelay = `${-p}s`;
  }
}

// ---- input ---------------------------------------------------------------
let ticking = false;
deck.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const h = deck.clientHeight;
    if (!h) return;
    paint();
    const i = Math.round(deck.scrollTop / h);
    if (i !== index) {
      index = i;
      refresh();
    }
  });
}, { passive: true });

prevBtn.addEventListener('click', () => goTo(index - 1));
nextBtn.addEventListener('click', () => goTo(index + 1));

deck.addEventListener('keydown', (e) => {
  const map = { ArrowDown: 1, PageDown: 1, ' ': 1, ArrowUp: -1, PageUp: -1 };
  if (e.key in map) {
    e.preventDefault();
    goTo(index + map[e.key]);
  } else if (e.key === 'Home') {
    e.preventDefault();
    goTo(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    goTo(pdf.numPages - 1);
  }
});

// ---- resize: keep the current page pinned --------------------------------
let t;
const onResize = () => {
  clearTimeout(t);
  t = setTimeout(() => {
    deck.scrollTo({ top: index * deck.clientHeight, behavior: 'auto' });
    refresh();
  }, 180);
};

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// Hidden tabs suspend requestAnimationFrame, which stalls pdf.js mid-render.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});

refresh();

// ---- first-run instruction ----------------------------------------------
let seen = false;
try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch { /* private mode */ }

if (!seen) {
  obCount.textContent = `${pdf.numPages} pages in this quarter's newsletter.`;
  onboard.hidden = false;

  const dismiss = () => {
    if (onboard.hidden || onboard.classList.contains('gone')) return;
    onboard.classList.add('gone');
    setTimeout(() => { onboard.hidden = true; }, 400);
    deck.removeEventListener('scroll', dismiss);
    try { localStorage.setItem(SEEN_KEY, '1'); } catch { /* private mode */ }
    deck.focus({ preventScroll: true });
  };

  onboardOk.addEventListener('click', dismiss);
  onboard.addEventListener('click', dismiss);
  deck.addEventListener('scroll', dismiss, { passive: true });
  onboardOk.focus({ preventScroll: true });
}
</script>

</body>
</html>
